name: Build Ghostgram Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - rewrite
      - main
      - master
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    name: Build Ghostgram APKs
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
      CCACHE_HARDLINK: "true"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup API Keys
        run: |
          cat << 'EOF' > API_KEYS
          APP_ID = 6
          APP_HASH = "eb06d4abfb49dc3eeb1aeb98ae0f581e"
          MAPS_V2_API = 
          SIGNING_KEY_STORE_PASSWORD = ghostgram2026
          SIGNING_KEY_ALIAS = ghostgram
          SIGNING_KEY_PASSWORD = ghostgram2026
          EOF

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e
          link-to-sdk: true

      - name: Generate Signing Keystore
        run: |
          mkdir -p TMessagesProj/config
          keytool -genkeypair -v \
            -keystore TMessagesProj/config/ghostgram.jks \
            -alias ghostgram \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ghostgram2026 \
            -keypass ghostgram2026 \
            -dname "CN=nullbe4r, OU=Ghostgram, O=Ghostgram, L=Ghostgram, S=Ghostgram, C=US"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle Build
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
            ~/.gradle/buildOutputCleanup/cache.properties
          key: gradle-builds-${{ github.sha }}
          restore-keys: |
            gradle-builds

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache
          restore-keys: ccache

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet/
          sudo rm -rf /usr/local/graalvm/
          sudo rm -rf /usr/local/.ghcup/
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          df -h

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Ghostgram APKs
        run: ./gradlew assembleArm64Release assembleAfatRelease --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p build_output
          find TMessagesProj/build/outputs/apk/ -name "*.apk" -exec cp {} build_output/ \;
          ls -la build_output/

      - name: Upload Ghostgram APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Ghostgram-Android-APKs
          path: build_output/*.apk
